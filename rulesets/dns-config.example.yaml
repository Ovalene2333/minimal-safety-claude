# Mihomo / Clash Verge DNS 策略模板 (dns_config.yaml 参考片段)
# 说明：
# 1. 将下方 13 项与 claude-egress 规则集保持同源，全部通过 egress 出口查询 Cloudflare DoH，不回退国内 DNS。
# 2. 如果目标内核支持 rule-set 语法，也可用一条 'rule-set:claude-egress' 替代下方 13 行逐项配置
#    （注意：在独立 dns_config.yaml 中若引用 rule-set:claude-egress，需确保 rule-providers 中已定义 claude-egress）。
# 3. 请将 'egress' 替换为你的实际策略组名称。

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,claude-egress,fake-ip
    # 保留你原有的 fake-ip 过滤规则（如局域网、NCSI、时间同步等返回 real-ip）
    - geosite:private,real-ip
    - geosite:cn,real-ip

  # 默认外网解析同样建议走代理，避免未知关联域名在本地泄露
  nameserver:
    - https://1.1.1.1/dns-query#egress
    - https://1.0.0.1/dns-query#egress

  nameserver-policy:
    # 7 个专属后缀
    "+.anthropic.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.claude.ai":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.claude.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.clau.de":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.claudemcpclient.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.claudemcpcontent.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "+.claudeusercontent.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    # 6 个精确外部主机
    "servd-anthropic-website.b-cdn.net":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "anthropic.com.cdn.cloudflare.net":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "anthropic.auth0.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "anthropic-com.ghost.io":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "http-intake.logs.us5.datadoghq.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    "browser-intake-us5-datadoghq.com":
      - https://1.1.1.1/dns-query#egress
      - https://1.0.0.1/dns-query#egress
    # 国内与内网域名继续走国内解析
    "geosite:private": system
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
