name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r portable/claude-routing/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s portable/claude-routing/tests -v

      - name: Validate YAML and JSON syntax
        run: |
          python -c "
          import json, pathlib, yaml
          for p in sorted(pathlib.Path('.').rglob('*.json')):
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON OK:', p)
          for p in sorted(pathlib.Path('.').rglob('*.y*ml')):
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print('YAML OK:', p)
          "
